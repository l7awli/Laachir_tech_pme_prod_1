services:
  - type: web
    name: laachir-tech
    env: docker
    dockerfilePath: ./Dockerfile
    # start.sh reads $PORT injected by Render and falls back to 8000
    dockerCommand: /bin/sh start.sh
    plan: free
    healthCheckPath: /login
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        # On Render free tier, SQLite is not persisted across deploys.
        # Set this to a Neon or Supabase PostgreSQL URL for persistent data.
        # Free PostgreSQL: https://neon.tech  or  https://supabase.com
        value: sqlite:///laachir_tech.db
      - key: FLASK_ENV
        value: production
